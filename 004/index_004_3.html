<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блоки сповіщення покращені</title>
</head>

<body>
    <style>
        p {
            padding: 20px;
        }
        
        .achievement {
            border-left: 5px solid rgb(0, 128, 1);
            background-color: rgb(144, 238, 144);
        }
        
        .information {
            border-left: 5px solid rgb(0, 0, 254);
            background-color: rgb(1, 255, 255);
        }
        
        .warning {
            border-left: 5px solid rgb(254, 214, 2);
            background-color: rgb(255, 255, 1);
        }
        
        .danger {
            border-left: 5px solid rgb(254, 0, 0);
            background-color: rgb(255, 192, 203);
        }
    </style>

    <p class="achievement">Успіх! Дані успішно збережено. </p>
    <p class="information">Інформація! Дані можливо редагувати.</p>
    <p class="warning">Попередження! Дані не збережено.</p>
    <p class="danger">Небезпечно! Дані будуть видалені назавжди.</p>
</body>

</html>
