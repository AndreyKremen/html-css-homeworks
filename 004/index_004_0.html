<!DOCTYPE html>
<html lang="en">

<head>

    <title>BLOC</title>

<body>
    <style>
        .bloc_one {
            width: 200px;
            height: 200px;
            background-color: blue;
            padding: 10px;
            border: 3px solid red;
            box-sizing: border-box;
        }
        
        .border {
            height: 10px;
        }
        
        .bloc_two {
            width: 200px;
            height: 200px;
            background-color: blue;
            padding: 10px;
            border: 3px solid red;
        }
    </style>
    <div class="bloc_one"></div>
    <div class="border"></div>
    <div class="bloc_two"></div>



</body>

</html>
