<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Соціальні мережі</title>
</head>

<body>
    <style>
        div {
            padding: 15px;
            width: max-content;
        }
        
        .facebook {
            background-color: rgb(0, 0, 254);
        }
        
        .instagram {
            background-color: rgb(255, 192, 203);
        }
        
        .twitter {
            background-color: rgb(1, 255, 255);
        }
        
        .youtube {
            background-color: rgb(254, 0, 0);
        }
    </style>

    <div class="facebook">
        <img src="/004/images/facebook.png" alt="facebook">
    </div>
    <div class="instagram">
        <img src="/004/images/instagram.png" alt="instagram">
    </div>
    <div class="twitter">
        <img src="/004/images/twitter.png" alt="twitter">
    </div>
    <div class="youtube">
        <img src="/004/images/-youtube.png" alt="youtube">
    </div>
</body>

</html>
