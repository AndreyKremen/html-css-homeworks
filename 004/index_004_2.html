<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блоки сповіщення</title>
</head>

<body>
    <style>
        p {
            padding: 20px;
            color: #fff;
        }
        
        .achievement {
            background-color: rgb(144, 238, 144);
        }
        
        .information {
            background-color: rgb(0, 0, 254)
        }
        
        .warning {
            background-color: rgb(254, 215, 0);
        }
        
        .danger {
            background-color: rgb(254, 0, 0);
        }
    </style>

    <p class="achievement">Успіх! Дані успішно збережено. </p>
    <p class="information">
        Інформація! Дані можливо редагувати.
    </p>
    <p class="warning">
        Попередження! Дані не збережено.
    </p>
    <p class="danger">
        Небезпечно! Дані будуть видалені назавжди.
    </p>
</body>

</html>
