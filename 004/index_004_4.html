<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вертікальне меню</title>

    <style>
        div {
            background-color: rgb(211, 211, 211);
            color: rgb(0, 0, 237);
            text-decoration: underline solid rgb(0, 0, 237) 1px;
            padding: 10px;
        }
        
        p {
            cursor: pointer;
            margin: 0;
        }
        
        .home {
            background-color: rgb(34, 139, 34);
            color: rgb(0, 5, 0);
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="home">
        <p>Головна</p>
    </div>
    <div>
        <p>Успіх!</p>
    </div>
    <div>
        <p>Інформація!</p>
    </div>
    <div>
        <p>Попередження!</p>
    </div>
    <div>
        <p>Небезпечно!</p>
    </div>

</body>

</html>
