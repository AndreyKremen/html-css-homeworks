<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML CSS JS</title>
</head>

<body>
    <style>
        h1 {
            font-weight: 400;
        }
        
        div {
            font-size: 2em;
            background-color: rgb(222, 222, 222);
        }
        
        .green {
            background-color: rgb(0, 128, 1);
            color: #fff;
        }
        
        .blue {
            background-color: rgb(1, 255, 255);
            background-color: lightseagreen;
        }
        
        .gold {
            background-color: rgb(254, 215, 0);
            color: rgb(247, 5, 0);
        }
    </style>

    <h1>HTML</h1>
    <div class="green">90%</div>
    <h1>CSS</h1>
    <div class="blue">70%</div>
    <h1>JS</h1>
    <div class="gold">20%</div>
</body>

</html>
